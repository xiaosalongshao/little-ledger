<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c9d4e7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="小账本"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><link rel="stylesheet" href="style.css"><title>小账本</title></head><body><div class="orb orb-one"></div><div class="orb orb-two"></div><main class="app-shell"><header><p class="eyebrow" id="today"></p><h1>小账本</h1><p class="subtitle">轻松记录，清楚了解每一笔花费。</p></header><section class="summary-grid"><button class="glass-card summary-card" data-report="week"><span class="summary-label">本周支出 <i>›</i></span><strong id="weekTotal">¥0.00</strong><small id="weekRange">本周</small></button><button class="glass-card summary-card" data-report="month"><span class="summary-label">本月支出 <i>›</i></span><strong id="monthTotal">¥0.00</strong><small id="monthRange">本月</small></button></section><div class="utility-row"><button id="openYear" type="button">年度支出 <span>›</span></button><button id="exportButton" type="button">导出数据 <span>↓</span></button></div><section class="recent-section"><div class="section-heading"><h2>最近记录</h2><button class="text-button" id="clearButton" type="button">清空</button></div><div id="recordList" class="record-list"></div><div id="emptyState" class="empty-state"><span>◎</span><p>还没有记录<br>从第一笔开始吧</p></div></section></main><button class="add-button" id="openSheet" type="button">+</button><div class="sheet-backdrop" id="backdrop" hidden></div><section class="entry-sheet" id="entrySheet"><div class="sheet-handle"></div><div class="sheet-heading"><h2 id="sheetTitle">记一笔</h2><button class="close-button" data-close type="button">×</button></div><form id="entryForm"><input id="editId" type="hidden"><label class="amount-field"><span>金额</span><div><b>¥</b><input id="amount" inputmode="decimal" type="number" min="0.01" step="0.01" placeholder="0.00" required></div></label><fieldset><legend>分类</legend><div class="category-grid" id="categoryGrid"></div></fieldset><div class="form-row"><label class="note-field"><span>备注 <em>可选</em></span><input id="note" maxlength="24" placeholder="例如：午餐"></label><label class="note-field date-field"><span>日期</span><input id="entryDate" type="date" required></label></div><button class="save-button" type="submit">保存这笔支出</button><button class="delete-button" id="deleteButton" type="button" hidden>删除这笔记录</button></form></section><section class="detail-sheet" id="reportSheet"><div class="sheet-handle"></div><div class="sheet-heading"><div><p id="reportCaption">支出分析</p><h2 id="reportTitle">本月支出</h2></div><button class="close-button" data-close type="button">×</button></div><strong class="report-total" id="reportTotal">¥0.00</strong><div class="chart" id="chart"></div><div class="breakdown" id="breakdown"></div></section><script src="app.js"></script></body></html>
